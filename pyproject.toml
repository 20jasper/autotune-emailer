[project]
name = "nightscout-autotune-tools"
version = "0.1.0"
description = "Typed Python helpers for the self-hosted Nightscout Autotune wrapper"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.15",
  "ruff>=0.11",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["cgm_stats.py", "send_report.py"]
warn_unused_ignores = true
