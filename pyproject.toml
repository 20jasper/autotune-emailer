[project]
name = "nightscout-autotune-tools"
version = "0.1.0"
description = "Typed Python helpers for the self-hosted Nightscout Autotune wrapper"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.15",
  "ruff>=0.11",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["app_password.py", "env_file.py", "send_report.py", "set_app_password.py"]
warn_unused_ignores = true
